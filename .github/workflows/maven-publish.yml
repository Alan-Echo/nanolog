# GitHub Actions Workflow for publishing Java artifacts to Maven Central (OSSRH)
# and GitHub Packages
#
# PREREQUISITES for Maven Central:
# You must set the following Secrets in your GitHub Repository settings:
# - MAVEN_USERNAME: Your Sonatype JIRA username
# - MAVEN_PASSWORD: Your Sonatype JIRA password
# - MAVEN_GPG_PASSPHRASE: The passphrase for your GPG private key
# - MAVEN_GPG_PRIVATE_KEY: The ASCII-armored GPG private key
#
name: Maven Publish

on:
  push:
    tags: [ "java-v*" ]
  workflow_dispatch:

jobs:
  # ==================== GitHub Packages（个人/团队仓库，免费） ====================
  publish-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to GitHub Packages
        run: |
          cd sdks/java/nanolog-spring-boot-starter
          mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Maven Central（官方仓库，需 Sonatype 账号） ====================
  publish-central:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coffersTech'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: |
          cd sdks/java/nanolog-spring-boot-starter
          mvn --batch-mode deploy -DskipTests -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
